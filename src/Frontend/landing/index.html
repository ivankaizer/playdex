<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <script>
        (() => {
            let savedTheme;
            try {
                savedTheme = localStorage.getItem("playdex.theme");
            } catch {
                savedTheme = null;
            }

            const prefersDark = typeof window.matchMedia === "function" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = savedTheme === "light" || savedTheme === "dark"
                ? savedTheme
                : prefersDark ? "dark" : "light";

            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.dataset.theme = theme;
            try {
                localStorage.setItem("playdex.theme", theme);
            } catch {
                // Theme still applies when storage is unavailable.
            }
        })();
    </script>
    <style>
        html[data-theme="light"] body,
        html[data-theme="light"] #app {
            background-color: #e4eaf0;
            color: #18212b;
        }

        html[data-theme="dark"] body,
        html[data-theme="dark"] #app {
            background-color: #0f151b;
            color: #e6ecf1;
        }

        .boot-loader {
            display: flex;
            min-height: 100dvh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 1.5rem;
        }

        .boot-loader__mark {
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }

        .boot-loader__dot {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 9999px;
            background-color: #6fe3b5;
            box-shadow: 0 0 0 4px rgba(111, 227, 181, 0.18);
        }

        .boot-loader__wordmark {
            margin: 0;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #097854;
        }

        html[data-theme="dark"] .boot-loader__wordmark {
            color: #5fd3a5;
        }

        .boot-loader__spinner {
            width: 2rem;
            height: 2rem;
            border-radius: 9999px;
            border: 3px solid rgba(148, 163, 184, 0.35);
            border-top-color: #09865e;
            animation: boot-spin 0.9s linear infinite;
        }

        html[data-theme="dark"] .boot-loader__spinner {
            border-color: rgba(71, 85, 105, 0.5);
            border-top-color: #6fe3b5;
        }

        .boot-loader__hint {
            margin: 0;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #6b7785;
        }

        html[data-theme="dark"] .boot-loader__hint {
            color: #8d99a6;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Playdex: your cross-platform playtime</title>
    <meta name="description" content="Connect Steam, PlayStation and Xbox and keep one history of your gaming sessions, streaks and favorite titles.">
</head>
<body>
    <div id="app">
        <div class="boot-loader" aria-live="polite" aria-busy="true">
            <div class="boot-loader__mark">
                <span class="boot-loader__dot"></span>
                <p class="boot-loader__wordmark">Playdex</p>
            </div>
            <div class="boot-loader__spinner" aria-hidden="true"></div>
                    </div>
    </div>
    <script type="module" src="/main.tsx"></script>
</body>
</html>
