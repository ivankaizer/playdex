server {
  listen 5056;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # nginx inherits add_header only into locations that set none of their own, so each location below
  # includes the security headers again next to its Cache-Control.
  include /etc/nginx/snippets/security-headers.conf;

  # Vite emits content-hashed bundles; they are safe to cache indefinitely.
  # A missing asset must be a real 404 rather than index.html so a stale
  # index.html referencing removed bundles fails loudly.
  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # OAuth discovery for assistants connecting to the MCP endpoint (RFC 8414, RFC 9728) lives at the origin's root,
  # but it is the API's to answer. Every Playdex compose file names the API service "app"; the address is resolved
  # per request through Docker's DNS, so nginx starts even before the API does.
  location ^~ /.well-known/oauth- {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $playdex_api http://app:3000;
    proxy_pass $playdex_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location = /appsettings.json {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri /index.html;
  }
}
