server {
  listen 5056;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # nginx inherits add_header only into locations that set none of their own, so each location below
  # includes the security headers again next to its Cache-Control.
  include /etc/nginx/snippets/security-headers.conf;

  # Vite emits content-hashed bundles; they are safe to cache indefinitely.
  # A missing asset must be a real 404 rather than index.html so a stale
  # index.html referencing removed bundles fails loudly.
  location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /appsettings.json {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri /index.html;
  }
}
