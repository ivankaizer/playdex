# Security headers for every response of the web app (user UI and /admin). nginx.conf includes this in
# every location: nginx drops the server-level add_header set from a location that sets its own.
#
# Content-Security-Policy:
# - script-src/style-src: the app's own bundles plus the theme script and boot-loader style inlined in
#   index.html, allowed by sha256 hash. `bun run check:csp` (run in CI and the image build) fails when a
#   hash no longer matches the built dist/index.html; it prints the new one.
# - Space Grotesk comes from Google Fonts; images come from Steam, IGDB, PlayStation, Xbox and the
#   posters host over https, data: for CSS icons and blob: for admin screenshots.
# - connect-src: the API on this origin (/api) and Sentry's ingest hosts. docker-entrypoint.sh adds the
#   origin of PLAYDEX_API_URL here at container start when the API is on another origin.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-f++1YCmltJXMhNu0wmoPa/24q1dxRHC40aphoBs/CcU='; style-src 'self' 'sha256-MXxjGA3DQ1FfYsz6cErIy3e24scXKCbIB9mn3z3A1uY=' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
