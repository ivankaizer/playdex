server {
  listen 5056;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # These files select the fingerprinted framework resources for a deployment.
  # They must be revalidated so a CDN cannot combine an old boot manifest with
  # assemblies from a newer container image.
  location = /_framework/blazor.webassembly.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /_framework/dotnet.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Framework assets are content-fingerprinted and safe to cache indefinitely.
  # A missing asset must be a real 404; returning index.html fails WASM integrity
  # checks and hides a mixed deployment or stale manifest.
  location ^~ /_framework/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /appsettings.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri /index.html;
  }
}
