<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <script>
        (() => {
            let savedTheme;
            try {
                savedTheme = localStorage.getItem("playdex.theme");
            } catch {
                savedTheme = null;
            }

            const prefersDark = typeof window.matchMedia === "function" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches;
            const theme = savedTheme === "light" || savedTheme === "dark"
                ? savedTheme
                : prefersDark ? "dark" : "light";

            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.dataset.theme = theme;
            try {
                localStorage.setItem("playdex.theme", theme);
            } catch {
                // Theme still applies when storage is unavailable.
            }
        })();
    </script>
    <style>
        html[data-theme="light"] body,
        html[data-theme="light"] #app {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        html[data-theme="dark"] body,
        html[data-theme="dark"] #app {
            background-color: #020617;
            color: #f1f5f9;
        }

        .boot-loader {
            display: flex;
            min-height: 100dvh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 1.5rem;
        }

        .boot-loader__mark {
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }

        .boot-loader__dot {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 9999px;
            background-color: #34d399;
            box-shadow: 0 0 14px rgba(52, 211, 153, 0.8);
        }

        .boot-loader__wordmark {
            margin: 0;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #047857;
        }

        html[data-theme="dark"] .boot-loader__wordmark {
            color: #6ee7b7;
        }

        .boot-loader__spinner {
            width: 2rem;
            height: 2rem;
            border-radius: 9999px;
            border: 3px solid rgba(148, 163, 184, 0.35);
            border-top-color: #10b981;
            animation: boot-spin 0.9s linear infinite;
        }

        html[data-theme="dark"] .boot-loader__spinner {
            border-color: rgba(71, 85, 105, 0.5);
            border-top-color: #34d399;
        }

        .boot-loader__hint {
            margin: 0;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #64748b;
        }

        html[data-theme="dark"] .boot-loader__hint {
            color: #94a3b8;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <link href="css/app.css" rel="stylesheet">
    <link href="Web.styles.css" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Playdex</title>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="app">
        <div class="boot-loader" aria-live="polite" aria-busy="true">
            <div class="boot-loader__mark">
                <span class="boot-loader__dot"></span>
                <p class="boot-loader__wordmark">Playdex</p>
            </div>
            <div class="boot-loader__spinner" aria-hidden="true"></div>
            <p class="boot-loader__hint">Loading your sessions…</p>
        </div>
    </div>
    <script src="js/playdex.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
