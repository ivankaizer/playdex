# Playdex on your own server: Postgres, the API, the web app and Caddy for HTTPS, on one host.
# Guide: https://docs.playdex.dev
#
#   cp .env.example .env     # set PLAYDEX_DOMAIN, POSTGRES_PASSWORD, JWT_SECRET
#   docker compose up -d     # pulls the images from ghcr.io
#   docker compose exec app dotnet Api.dll create-user you@example.com --admin
#
# To build from source instead of pulling: docker compose up -d --build (run from a clone of the repo).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playdex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: playdex
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playdex -d playdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  apprise:
    image: caronc/apprise:1.3.3
    restart: unless-stopped
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: 1
      APPRISE_API_ONLY: "yes"
    volumes:
      - apprise_config:/config
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/ivankaizer/playdex-app:${PLAYDEX_VERSION:-latest}
    build:
      context: ..
      dockerfile: src/Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:3000
      DATABASE_URL: postgresql://playdex:${POSTGRES_PASSWORD}@db:5432/playdex
      Auth__JwtSecret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Auth__AccessTokenTtl: 30m
      Apprise__BaseUrl: http://apprise:8000
      Apprise__TelegramBotToken: ${TELEGRAM_BOT_TOKEN:-}
      Polling__Igdb__ClientId: ${IGDB_CLIENT_ID:-}
      Polling__Igdb__ClientSecret: ${IGDB_CLIENT_SECRET:-}
      AiDrafts__Enabled: ${AI_DRAFTS_ENABLED:-false}
      AiDrafts__Provider: ${AI_DRAFTS_PROVIDER:-openai}
      AiDrafts__BaseUrl: ${AI_DRAFTS_BASE_URL:-https://api.openai.com/v1/responses}
      AiDrafts__ApiKey: ${AI_DRAFTS_API_KEY:-}
      AiDrafts__Model: ${AI_DRAFTS_MODEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      apprise:
        condition: service_healthy

  ui:
    image: ghcr.io/ivankaizer/playdex-ui:${PLAYDEX_VERSION:-latest}
    build:
      context: ..
      dockerfile: src/Frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - app

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      PLAYDEX_DOMAIN: ${PLAYDEX_DOMAIN:?set PLAYDEX_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - ui

volumes:
  db_data:
  apprise_config:
  caddy_data:
  caddy_config:
