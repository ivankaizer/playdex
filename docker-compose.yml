services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playdex
      POSTGRES_PASSWORD: playdex
      POSTGRES_DB: playdex
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playdex -d playdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    build:
      context: .
      dockerfile: tools/Wiremock/Dockerfile
    restart: unless-stopped
    volumes:
      - ./tools/Wiremock/mocks:/app/mocks:ro
    ports:
      - "8888:8888"

  apprise:
    image: caronc/apprise:1.3.3
    restart: unless-stopped
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: 1
      APPRISE_API_ONLY: "yes"
    volumes:
      - apprise_config:/config
      - apprise_attach:/attach
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:3000
      DATABASE_URL: postgresql://playdex:playdex@db:5432/playdex
      CORS_ORIGINS: "http://ui.playdex.orb.local,https://ui.playdex.orb.local"
      Polling__IntervalSeconds: 10
      Auth__JwtSecret: dev-only-jwt-secret-do-not-use-in-production
      Auth__AccessTokenTtl: 30m
      Polling__UseWiremock: "true"
      Apprise__BaseUrl: http://apprise:8000
      Apprise__TelegramBotToken: ${TELEGRAM_BOT_TOKEN:-}
      Apprise__UseMock: "false"
      Polling__Steam__BaseUrl: http://wiremock:8888
      Polling__Psn__OAuthAuthorizeUrl: http://wiremock:8888/api/authz/v3/oauth/authorize
      Polling__Psn__OAuthTokenUrl: http://wiremock:8888/api/authz/v3/oauth/token
      Polling__Psn__PresenceBaseUrl: http://wiremock:8888
      Polling__OpenXbl__BaseUrl: http://wiremock:8888
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      wiremock:
        condition: service_started
      apprise:
        condition: service_healthy
  ui:
    build:
      context: .
      dockerfile: src/Web/Dockerfile.dev
    restart: "no"
    environment:
      PLAYDEX_API_URL: "https://app.playdex.orb.local/api/"
    working_dir: /workspace/src/Web
    volumes:
      - .:/workspace
      - web_node_modules:/app/node_modules
      - dotnet_nuget:/root/.nuget/packages
      - web_bun_cache:/root/.bun/install/cache
    command: ["sh", "-c", "ln -sfn /app/node_modules /workspace/src/Web/node_modules && bun run css:watch & exec dotnet watch run --urls http://0.0.0.0:5173"]
    ports:
      - "5173:5173"
    depends_on:
      - app

  admin:
    build:
      context: .
      dockerfile: src/Admin/Dockerfile
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:3100
      DATABASE_URL: postgresql://playdex:playdex@db:5432/playdex
      Admin__AllowedOrigin: "http://admin.playdex.orb.local"
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  db_data:
  apprise_config:
  apprise_attach:
  web_node_modules:
  dotnet_nuget:
  web_bun_cache:
