services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playdex
      POSTGRES_PASSWORD: playdex
      POSTGRES_DB: playdex
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playdex -d playdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    build:
      context: .
      dockerfile: tools/Wiremock/Dockerfile
    restart: unless-stopped
    volumes:
      - ./tools/Wiremock/mocks:/app/mocks:ro
    ports:
      - "8888:8888"

  app:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:3000
      DATABASE_URL: postgresql://playdex:playdex@db:5432/playdex
      CORS_ORIGINS: "http://ui.playdex.orb.local,https://ui.playdex.orb.local"
      Polling__IntervalSeconds: 10
      Auth__JwtSecret: dev-only-jwt-secret-do-not-use-in-production
      Auth__AccessTokenTtl: 30m
      Polling__UseWiremock: "true"
      Telegram__UseMock: "true"
      Polling__Steam__BaseUrl: http://wiremock:8888
      Polling__Psn__OAuthAuthorizeUrl: http://wiremock:8888/api/authz/v3/oauth/authorize
      Polling__Psn__OAuthTokenUrl: http://wiremock:8888/api/authz/v3/oauth/token
      Polling__Psn__PresenceBaseUrl: http://wiremock:8888
      Polling__Psn__ClientId: mock-client-id
      Polling__Psn__RedirectUri: http://wiremock:8888/callback
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      wiremock:
        condition: service_started
  ui:
    build:
      context: .
      dockerfile: src/Web/Dockerfile.dev
    restart: "no"
    environment:
      PLAYDEX_API_URL: "https://app.playdex.orb.local/api/"
    volumes:
      - ./src/Web:/app
      - ./Directory.Build.props:/app/Directory.Build.props:ro
      - ./Directory.Packages.props:/app/Directory.Packages.props:ro
      - web_node_modules:/app/node_modules
      - dotnet_nuget:/root/.nuget/packages
      - web_bun_cache:/root/.bun/install/cache
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  db_data:
  web_node_modules:
  dotnet_nuget:
  web_bun_cache:
