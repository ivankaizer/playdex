version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playdex
      POSTGRES_PASSWORD: playdex
      POSTGRES_DB: playdex
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playdex -d playdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: "no"
    command: ["bun", "run", "dev"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://playdex:playdex@db:5432/playdex
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  ui:
    build:
      context: ./web
    restart: "no"
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  db_data:
