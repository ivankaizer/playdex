services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playdex
      POSTGRES_PASSWORD: playdex
      POSTGRES_DB: playdex
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playdex -d playdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./apps/api-dotnet
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:3000
      DATABASE_URL: postgresql://playdex:playdex@db:5432/playdex
      CORS_ORIGINS: "http://ui.playdex.orb.local,https://ui.playdex.orb.local"
      POLL_INTERVAL_SECONDS: 180
      JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
      ACCESS_TOKEN_TTL: 30m
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  ui:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - dotnet_nuget:/root/.nuget/packages
      - web_bun_cache:/root/.bun/install/cache
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  db_data:
  web_node_modules:
  dotnet_nuget:
  web_bun_cache:
