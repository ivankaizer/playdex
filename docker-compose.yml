services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playdex
      POSTGRES_PASSWORD: playdex
      POSTGRES_DB: playdex
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playdex -d playdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: "no"
    command: ["bun", "run", "dev"]
    environment:
      DATABASE_URL: postgresql://playdex:playdex@db:5432/playdex
      CORS_ORIGINS: "http://ui.playdex.orb.local,https://ui.playdex.orb.local"
      POLL_INTERVAL_SECONDS: 180
      JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
      IGDB_CLIENT_ID: REMOVED
      IGDB_CLIENT_SECRET: REMOVED
      ACCESS_TOKEN_TTL: 1m
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  ui:
    build:
      context: ./web
      args:
        VITE_API_URL: https://app.playdex.orb.local/api
      dockerfile: Dockerfile.dev
    restart: "no"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgresql://playdex:playdex@db:5432/playdex
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  db_data:
