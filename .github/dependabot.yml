# Weekly dependency updates, grouped so each ecosystem opens at most one pull request for minor and patch versions.
# Majors come as separate pull requests. Actions are pinned to commit SHAs; Dependabot keeps the pins and their
# version comments current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directories:
      - /src/Frontend
      - /src/Launcher/ui
      - /src/Docs
    schedule:
      interval: weekly
    groups:
      bun:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/Api
      - /src/Frontend
    schedule:
      interval: weekly
