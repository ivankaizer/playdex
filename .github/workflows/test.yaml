name: Test

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run for the previous one; pushes to main never cancel each other
# (they deploy production).
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: .NET and frontend tests
    # A private repository runs on macserv to save GitHub-hosted minutes. A public one gets those minutes for free
    # and runs on GitHub, so code from pull requests (forks included) never runs on macserv.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macserv"]') || 'ubuntu-latest' }}
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: playdex
          POSTGRES_PASSWORD: playdex
          POSTGRES_DB: playdex_db_test
        ports:
          - 5432   # a free host port: macserv runs other Postgres containers
        options: >-
          --health-cmd="pg_isready -U playdex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet   # the default /usr/share/dotnet isn't writable on macserv

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: src/Frontend

      - name: Typecheck frontend
        run: bun run typecheck
        working-directory: src/Frontend

      - name: Test frontend
        run: bun run test
        working-directory: src/Frontend

      - name: Build frontend
        run: bun run build
        working-directory: src/Frontend

      - name: Build landing
        run: bun run build:landing   # playdex.dev on Cloudflare Pages; deployed by landing.yml
        working-directory: src/Frontend

      - name: Strict Release build
        run: dotnet build Playdex.sln --configuration Release --warnaserror

      - name: Apply database migrations
        run: dotnet run --no-build --project src/Api --configuration Release -- migrate
        env:
          DATABASE_URL: postgresql://playdex:playdex@127.0.0.1:${{ job.services.db.ports['5432'] }}/playdex_db_test
          Auth__JwtSecret: ci-only-jwt-secret-at-least-thirty-two-bytes

      - name: Run .NET tests
        run: |
          dotnet test test/Api.Tests/Api.Tests.csproj --configuration Release --no-build
        env:
          PLAYDEX_INTEGRATION_DATABASE_URL: postgresql://playdex:playdex@127.0.0.1:${{ job.services.db.ports['5432'] }}/playdex_db_test

  preview:
    name: Preview
    needs: test
    # Secrets are unavailable to fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ivankaizer/preview-kit/.github/workflows/preview.yml@96a4c23d83f1bf93aa924e29adc101db7837a6a0 # v1
    with:
      runner: '["self-hosted","macserv"]'
      # One comment per deploy, so earlier demos stay in the PR thread.
      comment: new
    permissions:
      contents: write
      pull-requests: write
    secrets:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}

  # A push to main that passes the tests builds the production images on the macserv runner and
  # deploys them to https://dash.playdex.dev (preview-kit's release workflow; see the "production"
  # section of .preview/config.json). Roll back with `preview prod deploy main-<older sha>`.
  production:
    name: Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ivankaizer/preview-kit/.github/workflows/release.yml@96a4c23d83f1bf93aa924e29adc101db7837a6a0 # v1
    with:
      runner: '["self-hosted","macserv"]'
      tag: main-${{ github.sha }}
    secrets:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
