name: Test

on:
  pull_request:

jobs:
  test:
    name: .NET and frontend tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: playdex
          POSTGRES_PASSWORD: playdex
          POSTGRES_DB: playdex_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U playdex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: src/Frontend

      - name: Typecheck frontend
        run: bun run typecheck
        working-directory: src/Frontend

      - name: Test frontend
        run: bun run test
        working-directory: src/Frontend

      - name: Build frontend
        run: bun run build
        working-directory: src/Frontend

      - name: Strict Release build
        run: dotnet build Playdex.sln --configuration Release --warnaserror

      - name: Apply database migrations
        run: dotnet run --no-build --project src/Api --configuration Release -- migrate
        env:
          DATABASE_URL: postgresql://playdex:playdex@127.0.0.1:5432/playdex_db_test
          Auth__JwtSecret: test-secret-for-ci

      - name: Run .NET tests
        run: |
          dotnet test test/Api.Tests/Api.Tests.csproj --configuration Release --no-build
        env:
          PLAYDEX_INTEGRATION_DATABASE_URL: postgresql://playdex:playdex@127.0.0.1:5432/playdex_db_test
