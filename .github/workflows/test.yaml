name: Test

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run for the previous one; pushes to main never cancel each other
# (they deploy production).
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # observability/ (Grafana dashboards and alerts, applied with push.sh) is not part of the build: a change that only
  # touches it skips the tests and with them the preview, the images and the production deploy. Not a paths-ignore:
  # the tests are a required check, and a skipped job passes it where a workflow that never ran blocks the merge.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Unless the diff surely touches nothing else, build: a diff that fails builds too.
        run: |
          if files="$(git diff --name-only "$BASE...$HEAD")" && [[ -n "$files" ]] &&
             ! grep -qv '^observability/' <<<"$files"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "$files"

  test:
    name: .NET and frontend tests
    needs: changes
    # Also when the changes job failed: only a diff known to be observability-only skips the tests.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    # GitHub-hosted, so code from pull requests (forks included) never runs on macserv.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: playdex
          POSTGRES_PASSWORD: playdex
          POSTGRES_DB: playdex_db_test
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U playdex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Biome formats and lints src/Frontend, src/Launcher/ui, src/Docs and tools/downloads (biome.json).
      # `bun run format` at the root fixes what this reports.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript formatting and lint
        run: bun run biome ci .   # the local Biome; `bunx biome` could fetch the unrelated npm package "biome"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: src/Frontend

      - name: Typecheck frontend
        run: bun run typecheck
        working-directory: src/Frontend

      - name: Test frontend
        run: bun run test
        working-directory: src/Frontend

      - name: Build frontend
        run: bun run build
        working-directory: src/Frontend

      - name: Build landing
        run: bun run build:landing   # playdex.dev on Cloudflare Pages; deployed by landing.yml
        working-directory: src/Frontend

      - name: Check CSP hashes
        run: bun run check:csp   # the inline script/style hashes in the CSPs still match the built pages
        working-directory: src/Frontend

      - name: Install Launcher UI dependencies
        run: bun install --frozen-lockfile
        working-directory: src/Launcher/ui

      - name: Typecheck Launcher UI
        run: bun run typecheck   # built for the Windows apps by build-windows.yaml
        working-directory: src/Launcher/ui

      - name: Install Docs dependencies
        run: bun install --frozen-lockfile
        working-directory: src/Docs

      - name: Check Docs
        run: bun run check   # astro check; deployed by docs.yml
        working-directory: src/Docs

      - name: Strict Release build
        run: dotnet build Playdex.sln --configuration Release --warnaserror

      # The build already fails on code style (EnforceCodeStyleInBuild); this also catches whitespace.
      # `dotnet format Playdex.sln` fixes it. The Windows-only projects can't be loaded here, so only
      # their whitespace is checked, by folder.
      - name: Check C# formatting
        run: |
          dotnet format Playdex.sln --verify-no-changes
          dotnet format whitespace --folder --verify-no-changes --include src/Desktop/ src/Launcher/

      - name: Apply database migrations
        run: dotnet run --no-build --project src/Api --configuration Release -- migrate
        env:
          DATABASE_URL: postgresql://playdex:playdex@127.0.0.1:${{ job.services.db.ports['5432'] }}/playdex_db_test
          Auth__JwtSecret: ci-only-jwt-secret-at-least-thirty-two-bytes

      - name: Run .NET tests
        run: |
          dotnet test test/Api.Tests/Api.Tests.csproj --configuration Release --no-build
        env:
          PLAYDEX_INTEGRATION_DATABASE_URL: postgresql://playdex:playdex@127.0.0.1:${{ job.services.db.ports['5432'] }}/playdex_db_test

  preview:
    name: Preview
    needs: test
    # Secrets are unavailable to fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ivankaizer/preview-kit/.github/workflows/preview.yml@58d07e03ab648756e8eea86fb73bcef632892682 # v1
    with:
      # One comment per deploy, so earlier demos stay in the PR thread.
      comment: new
    permissions:
      contents: write
      pull-requests: write
    secrets:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}

  # A push to main that passes the tests publishes the images to GHCR (latest and sha-<commit>)...
  images:
    name: Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write

  # ...and deploys sha-<commit> to https://dash.playdex.dev: preview-kit's release workflow, without
  # building (see the "production" section of .preview/config.json). Dokploy pulls the public images.
  # Roll back with `preview prod deploy sha-<older commit>`.
  production:
    name: Production
    needs: images
    uses: ivankaizer/preview-kit/.github/workflows/release.yml@58d07e03ab648756e8eea86fb73bcef632892682 # v1
    with:
      runner: '"ubuntu-latest"'
      build: false
      tag: sha-${{ github.sha }}
    secrets:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
