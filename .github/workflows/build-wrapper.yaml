name: Build Windows Wrapper

on:
  push:
    branches:
      - main
    paths:
      - "src/Wrapper/**"
      - "src/Playdex.Core/**"
      - "test/Playdex.Core.Tests/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build wrapper for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish wrapper (win-x64, single-file)
        run: dotnet publish src/Wrapper/Wrapper.csproj -p:PublishProfile=SingleFile -o ./artifacts/win-x64

      - name: Run wrapper tests
        run: dotnet test test/Wrapper.Tests/Wrapper.Tests.csproj --configuration Release

      # Playdex.Core tests use the registry and Job Objects, so they run here on Windows, not in test.yaml.
      - name: Run Playdex.Core tests
        run: dotnet test test/Playdex.Core.Tests/Playdex.Core.Tests.csproj --configuration Release

      - name: Upload wrapper artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: playdex-wrapper-windows
          path: ./artifacts/**
