name: Build Millennium plugin

on:
  push:
    branches:
      - master
    paths:
      - "apps/millenium/**"
  workflow_dispatch:

jobs:
  build:
    name: Build plugin artifact
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/millenium

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Require plugin version bump
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $beforeSha = "${{ github.event.before }}"
          $afterVersion = (Get-Content "plugin.json" | ConvertFrom-Json).version
          $beforeJson = git show "$beforeSha`:apps/millenium/plugin.json" 2>$null

          if (-not $beforeJson) {
            Write-Host "Previous plugin.json was not found; skipping version bump check."
            exit 0
          }

          $beforeVersion = ($beforeJson | ConvertFrom-Json).version

          if ($beforeVersion -eq $afterVersion) {
            Write-Error "apps/millenium changed, but apps/millenium/plugin.json version was not bumped. Current version: $afterVersion"
            exit 1
          }

          Write-Host "Plugin version changed from $beforeVersion to $afterVersion."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm check

      - name: Run lint
        run: pnpm lint

      - name: Build plugin zip
        run: pnpm build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: playdex-millennium-plugin
          path: apps/millenium/playdex-*.zip
          if-no-files-found: error
