# Public images for self-hosting (selfhost/docker-compose.yml, docs.playdex.dev):
#   ghcr.io/ivankaizer/playdex-app   the API (src/Api/Dockerfile)
#   ghcr.io/ivankaizer/playdex-ui    the web app (src/Frontend/Dockerfile)
# Every push to main is tagged latest and sha-<commit>. linux/amd64 only for now.
# GHCR packages start private: make each one public once, under the package's settings on GitHub.
name: Images

on:
  push:
    branches: [main]
    paths: ['src/Api/**', 'src/Persistence/**', 'src/ServiceDefaults/**', 'src/Frontend/**', 'Directory.*.props', '.github/workflows/images.yml']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # macserv while the repository is private (GitHub-hosted minutes are limited), GitHub-hosted once it is public.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macserv"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: playdex-app
            dockerfile: src/Api/Dockerfile
          - image: playdex-ui
            dockerfile: src/Frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
