# Public images for self-hosting (selfhost/docker-compose.yml, docs.playdex.dev):
#   ghcr.io/ivankaizer/playdex-app   the API (src/Api/Dockerfile)
#   ghcr.io/ivankaizer/playdex-ui    the web app (src/Frontend/Dockerfile)
# Every push to main is tagged latest and sha-<commit>. linux/amd64 only for now.
# GHCR packages start private: make each one public once, under the package's settings on GitHub.
name: Images

on:
  push:
    branches: [main]
    paths: ['src/Api/**', 'src/Persistence/**', 'src/ServiceDefaults/**', 'src/Frontend/**', 'Directory.*.props', '.github/workflows/images.yml']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, macserv]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: playdex-app
            dockerfile: src/Api/Dockerfile
          - image: playdex-ui
            dockerfile: src/Frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
