# The docs (src/Docs, docs.playdex.dev) on Cloudflare Pages, project playdex-docs.
# push to main → production (docs.playdex.dev); pull request → preview on *.pages.dev, linked in a PR comment.
name: Docs

on:
  push:
    branches: [main]
    paths: ['src/Docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['src/Docs/**', '.github/workflows/docs.yml']

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: wrangler@4.135.0

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # macserv while the repository is private (GitHub-hosted minutes are limited), GitHub-hosted once it is public.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macserv"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write   # the preview link comment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: src/Docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/cloudflare.mjs project

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          BRANCH: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bunx "$WRANGLER" pages deploy dist --project-name playdex-docs \
            --branch "$BRANCH" --commit-hash "$SHA" --commit-dirty=true | tee deploy.log
          echo "url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
          echo "alias=$(grep -Eio 'alias URL: https://[a-z0-9.-]+\.pages\.dev' deploy.log | grep -Eo 'https://.*' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- playdex-docs-preview -->'
          body="$marker
          **Docs preview** (Cloudflare Pages): ${ALIAS:-$URL}
          - this commit (\`${SHA::7}\`): $URL"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh pr comment "$PR" --body "$body"; fi
