name: Release Windows apps

# A v<major>.<minor>.<patch> tag releases the Windows apps (see docs/windows-releases.md):
#   playdex-windows-v<version>.zip (+ .sha256)          the app folder; what Playdex updates itself from
#   Playdex-Setup.exe                                   the offline installer: installs, updates and uninstalls Playdex
#                                                       for the current user; the app (and the FSE package) is inside
#   playdex-wrapper-windows-v<version>.zip (+ .sha256)  the online setup as Wrapper.exe: how WinForms Wrapper
#                                                       installs (v1.x) update themselves into the app
#   playdex-launcher-v<version>.msix, playdex-launcher.cer
#                                                       the Full Screen Experience package, signed, when the
#                                                       LAUNCHER_SIGNING_PFX and LAUNCHER_SIGNING_PASSWORD secrets are set
# The files are made by tools/package-windows.ps1, which also builds them locally for a test.
# The same files go to download.playdex.dev, the public feed that installs, updates and the landing use.
# A tag builds on the PC when its runner is online and on GitHub otherwise; to choose, run the workflow by hand on the
# tag: gh workflow run release-windows.yaml --ref v<version> -f runner=pc (docs/windows-pc-runner.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build (auto is the PC when its runner is online); run it on the tag
        type: choice
        options: [auto, pc, github]
        default: auto

permissions:
  contents: write

jobs:
  runner:
    uses: ./.github/workflows/windows-runner.yaml
    with:
      choice: ${{ inputs.runner || 'auto' }}
    secrets:
      RUNNERS_TOKEN: ${{ secrets.RUNNERS_TOKEN }}

  release:
    name: Build and release the Windows apps (${{ needs.runner.outputs.where }})
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    # Scripts read the tag (and the version taken from it) from the environment: an expression expanded into a script's
    # text would run whatever a crafted ref name holds.
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to check that the tagged commit is on main.
          fetch-depth: 0

      # Only a v<major>.<minor>.<patch> tag on a commit that is on main releases; a tag pushed on any other commit
      # (a branch that never merged, say) stops here, before anything is built, signed or published.
      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tag '$tag' must use v<major>.<minor>.<patch>."
          }
          if ($env:GITHUB_REF -cne "refs/tags/$tag") { throw "Run the release on its tag, not on $env:GITHUB_REF." }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE) { throw "Could not fetch main." }
          $commit = git rev-parse HEAD
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -eq 1) { throw "$tag ($commit) is not on main; only commits on main are released." }
          if ($LASTEXITCODE) { throw "Could not check whether $tag ($commit) is on main." }
          "number=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
        env:
          # The PC's runner service can't write to the default C:\Program Files\dotnet.
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}\dotnet', runner.tool_cache) || '' }}

      # Native AOT links with MSVC, which it finds through vswhere; windows-latest has vswhere on PATH already.
      - name: Put vswhere on PATH
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Publish Playdex.Run (Native AOT)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: >
          dotnet publish src/Playdex.Run/Playdex.Run.csproj -c Release -r win-x64
          "-p:Version=$env:VERSION"
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o artifacts/run

      - name: Run Playdex.Core tests
        run: dotnet test test/Playdex.Core.Tests/Playdex.Core.Tests.csproj --configuration Release
        env:
          PLAYDEX_PUBLISHED_RUN: ${{ github.workspace }}\artifacts\run\Playdex.Run.exe

      - name: Build the UI
        working-directory: src/Launcher/ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package and sign the launcher (MSIX)
        id: launcher
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
          SIGNING_PFX: ${{ secrets.LAUNCHER_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.LAUNCHER_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX) {
            Write-Host "::notice::LAUNCHER_SIGNING_PFX is not set; this release has no Full Screen Experience launcher package."
            "built=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $version = $env:VERSION
          $pfx = Join-Path $env:RUNNER_TEMP 'launcher-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          # The package version is the release version (MSIX versions have four parts).
          $manifest = 'src/Launcher/Host/Package.appxmanifest'
          $text = [IO.File]::ReadAllText($manifest) -replace '(<Identity [^>]*Version=")[0-9.]+(")', "`${1}$version.0`${2}"
          [IO.File]::WriteAllText($manifest, $text)
          dotnet publish src/Launcher/Host/Playdex.Launcher.Host.csproj -c Release -r win-x64 -p:PackageMsix=true `
            -p:PackageCertificateKeyFile="$pfx" -p:PackageCertificatePassword="$env:SIGNING_PASSWORD"
          if ($LASTEXITCODE) { throw "Launcher packaging failed." }
          $msix = Get-ChildItem src/Launcher/Host/AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          # Signed by our self-signed certificate, which the runner doesn't trust: check the signer, not the status.
          $signer = (Get-AuthenticodeSignature $msix.FullName).SignerCertificate
          if (-not $signer) { throw "The launcher package is not signed." }
          Copy-Item $msix.FullName "artifacts/playdex-launcher-v$version.msix"
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGNING_PASSWORD)
          # Apps and setups only trust the certificate pinned in FsePackage.cs (docs/windows-releases.md, "Signing the launcher").
          $sha256 = [System.Security.Cryptography.HashAlgorithmName]::SHA256
          $pinned = [regex]::Match((Get-Content -Raw src/Playdex.Core/FsePackage.cs), 'SigningCertificateSha256 = "([0-9A-F]{64})"').Groups[1].Value
          foreach ($used in $cert, $signer) {
            if (-not $pinned -or $used.GetCertHashString($sha256) -ne $pinned) {
              throw "The launcher signing certificate ($($used.GetCertHashString($sha256))) is not the one pinned in FsePackage.SigningCertificateSha256 ('$pinned'); release the new thumbprint with the new certificate."
            }
          }
          [IO.File]::WriteAllBytes('artifacts/playdex-launcher.cer', $cert.Export('Cert'))
          Remove-Item $pfx
          "built=true" >> $env:GITHUB_OUTPUT

      - name: Package the Windows apps (Native AOT)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
          LAUNCHER_BUILT: ${{ steps.launcher.outputs.built }}
        run: |
          $version = $env:VERSION
          $package = @{ Version = $version; Out = 'artifacts'; Run = 'artifacts/run/Playdex.Run.exe' }
          if ($env:LAUNCHER_BUILT -eq 'true') {
            $package.Msix = "artifacts/playdex-launcher-v$version.msix"
            $package.Cer = 'artifacts/playdex-launcher.cer'
          }
          ./tools/package-windows.ps1 @package

      - name: Verify the release contract
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $version = $env:VERSION
          $tag = $env:TAG
          foreach ($exe in 'artifacts/app/Playdex.exe', 'artifacts/app/Playdex.Run.exe', 'artifacts/Playdex-Setup.exe') {
            $product = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
            if ($product -ne $version) { throw "$exe has product version '$product', not '$version'." }
          }
          foreach ($archive in "playdex-windows-$tag.zip", "playdex-wrapper-windows-$tag.zip") {
            $path = "artifacts/$archive"
            $checksum = (Get-Content -LiteralPath "$path.sha256" -Raw).Trim()
            if ($checksum -notmatch '^([0-9a-f]{64})  (.+)$' -or $Matches[2] -cne $archive) { throw "$archive.sha256 does not name $archive." }
            if ($Matches[1] -cne (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "$archive.sha256 does not match." }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $app = [IO.Compression.ZipFile]::OpenRead("artifacts/playdex-windows-$tag.zip")
          $names = $app.Entries.FullName; $app.Dispose()
          foreach ($required in 'Playdex.exe', 'Playdex.Run.exe', 'Playdex-Setup.exe', 'ui/index.html') {
            if ($names -notcontains $required -and $names -notcontains $required.Replace('/', '\')) { throw "The app archive has no $required." }
          }
          # The offline setup carries the app: it is bigger than the app archive.
          if ((Get-Item artifacts/Playdex-Setup.exe).Length -le (Get-Item "artifacts/playdex-windows-$tag.zip").Length) { throw "Playdex-Setup.exe has no app inside." }
          $bridge = [IO.Compression.ZipFile]::OpenRead("artifacts/playdex-wrapper-windows-$tag.zip")
          $bridgeNames = @($bridge.Entries.FullName); $bridge.Dispose()
          if ($bridgeNames.Count -ne 1 -or $bridgeNames[0] -ne 'Wrapper.exe') { throw "The Wrapper archive must hold only Wrapper.exe." }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/playdex-windows-${{ github.ref_name }}.zip
            artifacts/playdex-windows-${{ github.ref_name }}.zip.sha256
            artifacts/Playdex-Setup.exe
            artifacts/playdex-wrapper-windows-${{ github.ref_name }}.zip
            artifacts/playdex-wrapper-windows-${{ github.ref_name }}.zip.sha256

      - name: Add the launcher package to the release
        if: steps.launcher.outputs.built == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/playdex-launcher-v${{ steps.version.outputs.number }}.msix
            artifacts/playdex-launcher.cer

      # download.playdex.dev (Cloudflare R2): the public feed installs and updates read, since this repository is
      # private. Every asset under windows/<tag>/, then the release JSON, then latest.json (tools/downloads/publish.mjs).
      - name: Publish to download.playdex.dev
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun tools/downloads/publish.mjs release $env:TAG artifacts
