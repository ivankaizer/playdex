name: Release Windows apps

# A v<major>.<minor>.<patch> tag releases the Windows apps (see docs/windows-releases.md):
#   playdex-windows-v<version>.zip (+ .sha256)          the desktop app folder; what Playdex updates itself from
#   Playdex-Setup.exe                                   installs it for the current user
#   playdex-wrapper-windows-v<version>.zip (+ .sha256)  Playdex-Setup.exe as Wrapper.exe: how WinForms Wrapper
#                                                       installs (v1.x) update themselves into the desktop app
#   playdex-launcher-v<version>.msix, playdex-launcher.cer
#                                                       the Full Screen Experience launcher, signed, when the
#                                                       LAUNCHER_SIGNING_PFX and LAUNCHER_SIGNING_PASSWORD secrets are set

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release the Windows apps
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tag '$tag' must use v<major>.<minor>.<patch>."
          }
          "number=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Publish Playdex.Run (Native AOT)
        run: >
          dotnet publish src/Playdex.Run/Playdex.Run.csproj -c Release -r win-x64
          -p:Version=${{ steps.version.outputs.number }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o artifacts/run

      - name: Run Playdex.Core tests
        run: dotnet test test/Playdex.Core.Tests/Playdex.Core.Tests.csproj --configuration Release
        env:
          PLAYDEX_PUBLISHED_RUN: ${{ github.workspace }}\artifacts\run\Playdex.Run.exe

      - name: Build the UI
        working-directory: src/Launcher/ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Publish the desktop app (Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/Desktop/Playdex.Desktop.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.version.outputs.number }} `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -o artifacts/app
          if ($LASTEXITCODE) { throw "Desktop publish failed." }
          Copy-Item artifacts/run/Playdex.Run.exe artifacts/app/
          Get-ChildItem artifacts/app -Recurse -Filter *.pdb | Remove-Item

      - name: Publish the setup (Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/Playdex.Setup/Playdex.Setup.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.version.outputs.number }} `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -o artifacts/setup
          if ($LASTEXITCODE) { throw "Setup publish failed." }
          Copy-Item artifacts/setup/Playdex.Setup.exe artifacts/Playdex-Setup.exe

      - name: Create the archives and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          function Write-Checksum($path) {
            $name = Split-Path $path -Leaf
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$path.sha256" -Value "$hash  $name" -Encoding ascii -NoNewline
          }
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/playdex-windows-$tag.zip"
          Write-Checksum "artifacts/playdex-windows-$tag.zip"
          # The WinForms Wrapper's updater installs the single Wrapper.exe in this archive: the setup.
          New-Item -ItemType Directory artifacts/bridge | Out-Null
          Copy-Item artifacts/setup/Playdex.Setup.exe artifacts/bridge/Wrapper.exe
          Compress-Archive -Path artifacts/bridge/Wrapper.exe -DestinationPath "artifacts/playdex-wrapper-windows-$tag.zip"
          Write-Checksum "artifacts/playdex-wrapper-windows-$tag.zip"

      - name: Package and sign the launcher (MSIX)
        id: launcher
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.LAUNCHER_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.LAUNCHER_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX) {
            Write-Host "::notice::LAUNCHER_SIGNING_PFX is not set; this release has no Full Screen Experience launcher package."
            "built=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $version = "${{ steps.version.outputs.number }}"
          $pfx = Join-Path $env:RUNNER_TEMP 'launcher-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          # The package version is the release version (MSIX versions have four parts).
          $manifest = 'src/Launcher/Host/Package.appxmanifest'
          $text = [IO.File]::ReadAllText($manifest) -replace '(<Identity [^>]*Version=")[0-9.]+(")', "`${1}$version.0`${2}"
          [IO.File]::WriteAllText($manifest, $text)
          dotnet publish src/Launcher/Host/Playdex.Launcher.Host.csproj -c Release -r win-x64 -p:PackageMsix=true `
            -p:PackageCertificateKeyFile="$pfx" -p:PackageCertificatePassword="$env:SIGNING_PASSWORD"
          if ($LASTEXITCODE) { throw "Launcher packaging failed." }
          $msix = Get-ChildItem src/Launcher/Host/AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          # Signed by our self-signed certificate, which the runner doesn't trust: check the signer, not the status.
          if (-not (Get-AuthenticodeSignature $msix.FullName).SignerCertificate) { throw "The launcher package is not signed." }
          Copy-Item $msix.FullName "artifacts/playdex-launcher-v$version.msix"
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGNING_PASSWORD)
          [IO.File]::WriteAllBytes('artifacts/playdex-launcher.cer', $cert.Export('Cert'))
          Remove-Item $pfx
          "built=true" >> $env:GITHUB_OUTPUT

      - name: Verify the release contract
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.number }}"
          $tag = "${{ github.ref_name }}"
          foreach ($exe in 'artifacts/app/Playdex.exe', 'artifacts/app/Playdex.Run.exe', 'artifacts/Playdex-Setup.exe') {
            $product = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
            if ($product -ne $version) { throw "$exe has product version '$product', not '$version'." }
          }
          foreach ($archive in "playdex-windows-$tag.zip", "playdex-wrapper-windows-$tag.zip") {
            $path = "artifacts/$archive"
            $checksum = (Get-Content -LiteralPath "$path.sha256" -Raw).Trim()
            if ($checksum -notmatch '^([0-9a-f]{64})  (.+)$' -or $Matches[2] -cne $archive) { throw "$archive.sha256 does not name $archive." }
            if ($Matches[1] -cne (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "$archive.sha256 does not match." }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $app = [IO.Compression.ZipFile]::OpenRead("artifacts/playdex-windows-$tag.zip")
          $names = $app.Entries.FullName; $app.Dispose()
          foreach ($required in 'Playdex.exe', 'Playdex.Run.exe', 'ui/index.html') {
            if ($names -notcontains $required -and $names -notcontains $required.Replace('/', '\')) { throw "The app archive has no $required." }
          }
          $bridge = [IO.Compression.ZipFile]::OpenRead("artifacts/playdex-wrapper-windows-$tag.zip")
          $bridgeNames = @($bridge.Entries.FullName); $bridge.Dispose()
          if ($bridgeNames.Count -ne 1 -or $bridgeNames[0] -ne 'Wrapper.exe') { throw "The Wrapper archive must hold only Wrapper.exe." }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/playdex-windows-${{ github.ref_name }}.zip
            artifacts/playdex-windows-${{ github.ref_name }}.zip.sha256
            artifacts/Playdex-Setup.exe
            artifacts/playdex-wrapper-windows-${{ github.ref_name }}.zip
            artifacts/playdex-wrapper-windows-${{ github.ref_name }}.zip.sha256

      - name: Add the launcher package to the release
        if: steps.launcher.outputs.built == 'true'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/playdex-launcher-v${{ steps.version.outputs.number }}.msix
            artifacts/playdex-launcher.cer
