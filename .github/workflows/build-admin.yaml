name: Build and publish Admin Docker image

on:
  push:
    branches:
      - main
    paths:
      - "src/Admin/**"
      - "src/Persistence/**"
      - "src/ServiceDefaults/**"
      - "Directory.*.props"
      - "Directory.*.targets"
      - "NuGet.Config"
      - "global.json"
      - ".dockerignore"
      - ".github/workflows/build-admin.yaml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build:
    name: Build Admin image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Admin image
        run: docker build -f src/Admin/Dockerfile -t playdex-admin:${{ github.sha }} .

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Admin image to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.REPO_NAME }}-admin
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "playdex-admin:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "playdex-admin:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
