name: Build Windows apps

# Builds and tests the Windows apps on pull requests and pushes to main that touch them: Playdex.Core (with a real
# generated launcher from the published Playdex.Run), the desktop app and the Full Screen Experience launcher. The
# WinUI projects can't build on Linux, so they are not in Playdex.sln and build here instead of in test.yaml.
# Windows minutes count double against the GitHub Actions quota, hence the path filter.

on:
  push:
    branches:
      - main
    paths: &paths
      - "src/Playdex.Core/**"
      - "src/Playdex.Run/**"
      - "src/Playdex.Setup/**"
      - "src/Desktop/**"
      - "src/Launcher/**"
      - "test/Playdex.Core.Tests/**"
      # Playdex.Core.Tests runs the API in process.
      - "src/Api/**"
      - "src/Persistence/**"
      - "src/ServiceDefaults/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/build-windows.yaml"
      - ".github/workflows/windows-runner.yaml"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build (auto is the PC when its runner is online)
        type: choice
        options: [auto, pc, github]
        default: auto

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner:
    uses: ./.github/workflows/windows-runner.yaml
    with:
      choice: ${{ inputs.runner || 'auto' }}
    secrets:
      RUNNERS_TOKEN: ${{ secrets.RUNNERS_TOKEN }}

  build:
    name: Build and test the Windows apps (${{ needs.runner.outputs.where }})
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
        env:
          # The PC's runner service can't write to the default C:\Program Files\dotnet.
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && format('{0}\dotnet', runner.tool_cache) || '' }}

      # Native AOT links with MSVC, which it finds through vswhere; windows-latest has vswhere on PATH already.
      - name: Put vswhere on PATH
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Publish Playdex.Run (Native AOT)
        run: dotnet publish src/Playdex.Run/Playdex.Run.csproj -c Release -r win-x64 -o ./artifacts/run

      # Playdex.Core tests use the registry and Job Objects, so they run here on Windows, not in test.yaml. With the
      # published Playdex.Run they also run a real generated per-game launcher and a real update rollback.
      - name: Run Playdex.Core tests
        run: dotnet test test/Playdex.Core.Tests/Playdex.Core.Tests.csproj --configuration Release
        env:
          PLAYDEX_PUBLISHED_RUN: ${{ github.workspace }}\artifacts\run\Playdex.Run.exe

      - name: Build the UI
        working-directory: src/Launcher/ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the desktop app, the launcher and the setup
        run: |
          dotnet build src/Desktop/Playdex.Desktop.csproj -c Release
          dotnet build src/Launcher/Host/Playdex.Launcher.Host.csproj -c Release
          dotnet build src/Playdex.Setup/Playdex.Setup.csproj -c Release
