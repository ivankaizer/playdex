name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Self-hosted server
        - dash.playdex.dev
        - Windows app
        - Full-screen launcher
        - Docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag (`PLAYDEX_VERSION`) or Windows app version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs app`, or the Windows app log. Remove tokens and keys first."
      render: text
