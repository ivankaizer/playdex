# Production stack: https://dash.playdex.dev (UI at /, API at /api). Deployed by preview-kit on every push
# to main that passes the tests: CI builds the images on the macserv runner and pushes them to the
# registry on that host; Dokploy runs this file without its build sections, with IMAGE_TAG,
# DATABASE_URL, JWT_SECRET and CORS_ORIGINS in the stack's .env. Optional keys (IGDB, Telegram,
# AI drafts, Sentry, R2 posters) are set in that .env by hand from Dokploy.
#
# Rules: plain ${VAR} for runtime settings (CI builds without them), mem_limit on every service, no
# host ports. No seeder and no wiremock: the seeder truncates every table, and polling talks to the
# real Steam/PSN/OpenXbl APIs. The API applies its migrations on startup.
services:
  apprise:
    image: caronc/apprise:1.3.3
    restart: unless-stopped
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: 1
      APPRISE_API_ONLY: "yes"
    volumes:
      - apprise_config:/config
      - apprise_attach:/attach
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m

  app:
    image: localhost:5000/playdex/app:${IMAGE_TAG:?}
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:3000
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      Auth__JwtSecret: ${JWT_SECRET}
      Auth__AccessTokenTtl: 30m
      Apprise__BaseUrl: http://apprise:8000
      Apprise__TelegramBotToken: ${TELEGRAM_BOT_TOKEN}
      Polling__Igdb__ClientId: ${IGDB_CLIENT_ID}
      Polling__Igdb__ClientSecret: ${IGDB_CLIENT_SECRET}
      Posters__PublicBaseUrl: https://dash.playdex.dev
      Posters__R2__AccountId: ${R2_ACCOUNT_ID}
      Posters__R2__AccessKeyId: ${R2_ACCESS_KEY_ID}
      Posters__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY}
      Posters__R2__Bucket: ${R2_POSTERS_BUCKET}
      AiDrafts__Enabled: ${AI_DRAFTS_ENABLED:-false}
      AiDrafts__ApiKey: ${AI_DRAFTS_API_KEY}
      AiDrafts__Model: ${AI_DRAFTS_MODEL}
      Sentry__Dsn: ${SENTRY_DSN}
      Sentry__Environment: production
      Sentry__Release: ${IMAGE_TAG}
    depends_on:
      apprise:
        condition: service_healthy
    networks: [default, dokploy-network]
    mem_limit: 512m

  ui:
    image: localhost:5000/playdex/ui:${IMAGE_TAG:?}
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    mem_limit: 64m

volumes:
  apprise_config:
  apprise_attach:

networks:
  dokploy-network:
    external: true
